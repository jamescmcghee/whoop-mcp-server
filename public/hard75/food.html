<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Log — 75 Hard</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<div class="topbar">
  <h1>Food Log</h1>
  <span id="today-date" style="font-size:13px;color:var(--text-muted)"></span>
</div>

<!-- Macro summary -->
<div class="macro-bar">
  <div class="macro-grid">
    <div class="macro-item">
      <div class="val" id="total-cal">0</div>
      <div class="lbl">Calories</div>
    </div>
    <div class="macro-item">
      <div class="val" id="total-protein">0g</div>
      <div class="lbl">Protein</div>
    </div>
    <div class="macro-item">
      <div class="val" id="total-carbs">0g</div>
      <div class="lbl">Carbs</div>
    </div>
    <div class="macro-item">
      <div class="val" id="total-fat">0g</div>
      <div class="lbl">Fat</div>
    </div>
  </div>
</div>

<div class="container mt-2">

  <!-- Barcode scanner -->
  <button class="scan-btn" id="scan-btn" onclick="toggleScanner()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><path d="M21 16v2a2 2 0 01-2 2h-2"/><path d="M16 21h2a2 2 0 002-2v-2"/><line x1="12" y1="3" x2="12" y2="9"/><line x1="12" y1="15" x2="12" y2="21"/><line x1="3" y1="12" x2="9" y2="12"/><line x1="15" y1="12" x2="21" y2="12"/></svg>
    Scan Barcode
  </button>

  <div id="scanner-container"></div>
  <div id="scan-status" class="text-muted text-center mt-1 hidden"></div>

  <!-- Add food form -->
  <div class="card" id="add-form-card">
    <div class="card-header">
      <div class="card-icon">➕</div>
      <div><div class="card-title">Add Food</div></div>
    </div>

    <label class="field-label">Product Name *</label>
    <input type="text" id="food-name" class="input-field" placeholder="e.g. Greek Yogurt" />

    <label class="field-label">Brand</label>
    <input type="text" id="food-brand" class="input-field" placeholder="e.g. Chobani" />

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div>
        <label class="field-label">Calories</label>
        <input type="number" id="food-cal" class="input-field" placeholder="kcal" min="0" />
      </div>
      <div>
        <label class="field-label">Serving Size</label>
        <input type="text" id="food-serving" class="input-field" placeholder="e.g. 100g" />
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
      <div>
        <label class="field-label">Protein (g)</label>
        <input type="number" id="food-protein" class="input-field" placeholder="0" min="0" step="0.1" />
      </div>
      <div>
        <label class="field-label">Carbs (g)</label>
        <input type="number" id="food-carbs" class="input-field" placeholder="0" min="0" step="0.1" />
      </div>
      <div>
        <label class="field-label">Fat (g)</label>
        <input type="number" id="food-fat" class="input-field" placeholder="0" min="0" step="0.1" />
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div>
        <label class="field-label">Quantity</label>
        <input type="number" id="food-qty" class="input-field" value="1" min="0.1" step="0.1" />
      </div>
      <div>
        <label class="field-label">Meal</label>
        <select id="food-meal" class="input-field">
          <option value="breakfast">Breakfast</option>
          <option value="lunch">Lunch</option>
          <option value="dinner">Dinner</option>
          <option value="snack" selected>Snack</option>
        </select>
      </div>
    </div>

    <input type="hidden" id="food-barcode" />
    <button class="btn-primary mt-2" onclick="addFood()">Add to Log</button>
  </div>

  <!-- Today's food list -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon">📋</div>
      <div><div class="card-title">Today's Log</div></div>
    </div>
    <div id="food-list">
      <div class="text-center text-muted" style="padding:20px 0">No food logged yet</div>
    </div>
  </div>

</div>

<div class="toast" id="toast">Saved</div>

<nav class="bottom-nav">
  <a href="/index.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Dashboard
  </a>
  <a href="/food.html" class="nav-item active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
    Food
  </a>
  <a href="/reading.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
    Reading
  </a>
  <a href="/photos.html" class="nav-item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    Photos
  </a>
</nav>

<script type="module" src="/js/food.js"></script>
</body>
</html>
