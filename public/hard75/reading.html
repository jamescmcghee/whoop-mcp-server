<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading — 75 Hard</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<div class="topbar">
  <h1>Reading</h1>
  <span style="font-size:13px;color:var(--text-muted)">10 pages / day</span>
</div>

<div class="container mt-2">

  <!-- Topic selector -->
  <div class="card">
    <div class="card-header">
      <div class="card-icon">🔍</div>
      <div>
        <div class="card-title">Choose a Topic</div>
        <div class="card-subtitle">Search any non-fiction subject</div>
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <input type="text" id="topic-input" class="input-field" placeholder="e.g. Stoicism, Discipline, Nutrition..." style="margin-bottom:0;flex:1" />
      <button class="btn-primary" style="width:auto;padding:12px 18px" onclick="loadArticle()">Load</button>
    </div>
    <div id="quick-topics" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
      <button class="topic-chip" onclick="setTopic('Stoicism')">Stoicism</button>
      <button class="topic-chip" onclick="setTopic('Discipline')">Discipline</button>
      <button class="topic-chip" onclick="setTopic('Nutrition')">Nutrition</button>
      <button class="topic-chip" onclick="setTopic('Exercise physiology')">Exercise</button>
      <button class="topic-chip" onclick="setTopic('Sleep')">Sleep</button>
      <button class="topic-chip" onclick="setTopic('Mindset')">Mindset</button>
    </div>
  </div>

  <!-- Today's status badge -->
  <div id="done-badge" class="reading-done-badge hidden">
    ✅ Reading complete for today! Great work.
  </div>

  <!-- Loading indicator -->
  <div id="loading" class="hidden"><div class="spinner"></div></div>

  <!-- Article not loaded state -->
  <div id="no-article" class="text-center text-muted" style="padding:40px 0">
    <div style="font-size:48px;margin-bottom:12px">📚</div>
    <p>Choose a topic above to start reading</p>
  </div>

  <!-- Article content -->
  <div id="article-area" class="hidden">
    <div style="margin-bottom:12px">
      <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.8px">Reading</div>
      <h2 id="article-title" style="font-size:20px;font-weight:700;margin-top:4px"></h2>
    </div>

    <!-- Page navigator -->
    <div class="page-nav">
      <button id="prev-btn" onclick="changePage(-1)" disabled>← Prev</button>
      <span class="page-info" id="page-info">Page 1 of 1</span>
      <button id="next-btn" onclick="changePage(1)">Next →</button>
    </div>

    <!-- Reading progress bar -->
    <div class="prog-bg" style="margin-bottom:12px">
      <div class="prog-fill" id="reading-prog" style="width:0%"></div>
    </div>

    <!-- Article text -->
    <div class="reading-article" id="article-text"></div>

    <!-- Mark complete -->
    <button class="complete-btn" id="complete-btn" disabled onclick="markComplete()">
      Read pages 1–10 to unlock completion
    </button>
  </div>

</div>

<div class="toast" id="toast">Saved</div>

    Photos

<style>
.topic-chip {
  background: var(--bg-card2);
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.topic-chip:hover {
  border-color: var(--primary);
  color: var(--primary);
}
</style>
