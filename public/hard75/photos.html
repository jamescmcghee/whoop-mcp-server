<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress Photos — 75 Hard</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

<div class="topbar">
  <h1>Progress Photos</h1>
  <span id="photo-count" style="font-size:13px;color:var(--text-muted)">0 photos</span>
</div>

<div class="container mt-2">

  <!-- Upload area -->
  <div class="photo-upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
    <div class="upload-icon">📸</div>
    <p>Tap to upload a progress photo<br/><span style="font-size:12px">or drag &amp; drop here</span></p>
    <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none" onchange="uploadPhoto(event)" />
  </div>

  <div id="upload-progress" class="hidden" style="margin-bottom:16px">
    <div class="prog-bg"><div class="prog-fill" id="upload-bar" style="width:0%"></div></div>
    <p class="text-center text-muted mt-1" style="font-size:13px">Uploading...</p>
  </div>

  <div id="notes-form" class="card hidden" style="margin-bottom:12px">
    <label class="field-label">Notes (optional)</label>
    <input type="text" id="photo-notes" class="input-field" placeholder="e.g. Week 3 check-in" />
    <div style="display:flex;gap:10px;margin-top:8px">
      <button class="btn-primary" style="flex:1" onclick="confirmUpload()">Upload</button>
      <button onclick="cancelUpload()" style="flex:1;background:var(--bg-card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;cursor:pointer">Cancel</button>
    </div>
  </div>

  <!-- Photo gallery -->
  <div id="empty-state" class="text-center text-muted" style="padding:40px 0">
    <div style="font-size:48px;margin-bottom:12px">📷</div>
    <p>No photos yet. Upload your first progress photo!</p>
  </div>

  <div id="photo-grid" class="photo-grid hidden"></div>

</div>

<!-- Full size photo modal -->
<div class="modal-overlay" id="photo-modal" onclick="closeModal()">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <img class="modal-img" id="modal-img" src="" alt="Progress photo" />
</div>

<div class="toast" id="toast"></div>
